<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Confirmed Fire α0.1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="CF α0.1">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="TemplateData/icon-180.png">
    <link rel="icon" href="TemplateData/icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      </div>
      <div id="unity-warning"></div>
    </div>

    <div id="cf-loading">
      <div id="cf-title">Confirmed Fire</div>
      <div id="cf-subtitle">Test Alpha 0.1</div>
      <div id="cf-bar"><div id="cf-bar-fill"></div></div>
      <div id="cf-percent">0%</div>
      <div id="cf-error"></div>
    </div>

    <div id="cf-rotate">
      <div>Rotate your phone</div>
      <div id="cf-rotate-sub">Confirmed Fire is played in landscape</div>
    </div>

    <div id="cf-a2hs">
      <span>Share &rarr; Add to Home Screen to play full screen</span>
      <button id="cf-a2hs-close" type="button" aria-label="Dismiss">&times;</button>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var warningBanner = document.querySelector("#unity-warning");
      var loadingScreen = document.querySelector("#cf-loading");
      var barFill = document.querySelector("#cf-bar-fill");
      var percentLabel = document.querySelector("#cf-percent");
      var errorBox = document.querySelector("#cf-error");

      // Shows a temporary message in a small strip at the top, or a
      // persistent one if type=='error'.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.textContent = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.className = 'cf-banner-error';
        else {
          if (type == 'warning') div.className = 'cf-banner-warning';
          setTimeout(function() {
            if (div.parentNode === warningBanner) warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-fullscreen-container",
        companyName: "Confirmed Fire",
        productName: "Confirmed Fire",
        productVersion: "0.1",
        showBanner: unityShowBanner,
        // Cap the render resolution for iPhone performance.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
      };

      // config.matchWebGLToCanvasSize is left at its default.

      // ---- Portrait "Rotate your phone" overlay (touch devices only) ----
      var isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
      var rotateOverlay = document.querySelector("#cf-rotate");
      function updateOrientation() {
        var portrait = window.innerHeight > window.innerWidth;
        rotateOverlay.style.display = (isTouch && portrait) ? "flex" : "none";
      }
      window.addEventListener("resize", updateOrientation);
      window.addEventListener("orientationchange", updateOrientation);
      updateOrientation();

      // ---- Add to Home Screen hint (iOS Safari, first open only) ----
      (function () {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isSafari = /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//i.test(ua);
        if (!isIOS || !isSafari || navigator.standalone === true) return;
        var seen = false;
        try { seen = localStorage.getItem("cf_a2hs_dismissed") === "1"; } catch (e) {}
        if (seen) return;
        var banner = document.querySelector("#cf-a2hs");
        banner.style.display = "flex";
        document.querySelector("#cf-a2hs-close").addEventListener("click", function () {
          banner.style.display = "none";
          try { localStorage.setItem("cf_a2hs_dismissed", "1"); } catch (e) {}
        });
      })();

      // ---- Loader ----
      function hideLoading() {
        loadingScreen.style.display = "none";
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var pct = Math.round(100 * progress);
          barFill.style.width = pct + "%";
          percentLabel.textContent = pct + "%";
          if (progress >= 1) hideLoading();
        }).then((unityInstance) => {
          hideLoading();
        }).catch((message) => {
          loadingScreen.style.display = "flex";
          errorBox.style.display = "block";
          errorBox.textContent = String(message);
        });
      };
      script.onerror = () => {
        loadingScreen.style.display = "flex";
        errorBox.style.display = "block";
        errorBox.textContent = "Failed to load " + loaderUrl;
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
